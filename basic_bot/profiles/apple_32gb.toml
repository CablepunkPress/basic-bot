# Hardware Profile: Apple 32GB
# Designed for: Apple M6 Mac Mini 32GB Unified Memory
#
# Reasoning tables
# A [reasoning] table describes how a model reasons, in the engine's
# terms, and how those terms translate for this model's chat template.
# No table: the model does not reason.
#   mode                    "optional" (can be switched off) or "always"
#   default                 optional only: on or off when nothing is chosen
#   switch_key              optional only: chat_template_kwargs key for on/off
#   effort_levels           levels the model accepts, lowest to highest
#   effort_default          level used when nothing is chosen
#   effort_key              chat_template_kwargs key for the level
#   effort_needs_reasoning  optional only: true if effort does nothing
#                           while reasoning is off


# --- Embedding ---
# Base: https://huggingface.co/mistralai/Ministral-3-8B-Base-2512
#   └─ Post-Training: https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512
#      └─ Fine-Tuning: https://huggingface.co/nvidia/Nemotron-3-Embed-8B-BF16
#          └─ Quantization: https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF
# 8-bit = ~8.46 GB
[embedding]
file = "Nemotron-3-Embed-8B-Q8_0.gguf"
url = "https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF/resolve/main/Nemotron-3-Embed-8B-Q8_0.gguf"
download = true
alias = "nemotron-3-embed-8b-q8_0"
query_prefix = "query: "
passage_prefix = "passage: "
gpu_layers = -1
ctx_size = 16384
batch_size = 16384
ubatch_size = 16384


# --- Summary ---
# Base: https://huggingface.co/google/gemma-4-12B
#   └─ Fine-Tuning: https://huggingface.co/google/gemma-4-12B-it
#       └─ Quantization: https://huggingface.co/bartowski/gemma-4-12B-it-GGUF
# 8-bit = ~12.7 GB
[summary]
file = "gemma-4-12B-it-Q8_0.gguf"
url = "https://huggingface.co/bartowski/gemma-4-12B-it-GGUF/resolve/main/gemma-4-12B-it-Q8_0.gguf"
download = true
alias = "gemma-4-12b-it-q8_0"
provider = "Google"
family = "Gemma"
gpu_layers = -1
flash_attn = "on"
ctx_size = 16384
max_tokens = 8192

[summary.reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"

[summary.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0


# --- Chat Models ---

# --- Muse Glimmer 30B ---
# Base: https://huggingface.co/meta-models/Muse-Glimmer-30B
#   └─ Quantization: https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
# 4-bit: ~19.7 GB

# From the GGUF model card:
# - llama-server must run with --jinja. The chat template is embedded in
#   the GGUF and handles reasoning strength and output parsing.
# - Reasoning cannot be switched off. --reasoning off and
#   reasoning_effort "none" have no effect.
# - Strength is set per request with
#   chat_template_kwargs {"reasoning_strength": "<level>"}.
#   Levels: low / medium / high / xhigh. Default: high.
#   The template also accepts a "Reasoning strength: <level>" or
#   "Reasoning effort: <level>" line in the system prompt.
# - Thinking arrives separately in reasoning_content.
# - llama-server divides -c across -np slots. A generation that runs out
#   of context returns no answer and no error.
# - Stop tokens are <|end_of_text|> and <|eot|>. Never stop on <|eom|>.

[chat."muse-glimmer-30b-q4_k_xl"]
file = "Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
url = "https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/main/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
download = true
default = true
alias = "muse-glimmer-30b-q4_k_xl"
display_name = "Muse Glimmer 30B Q4_K_XL"
provider = "Meta"
family = "Muse"
rank = 1
gpu_layers = -1
flash_attn = "on"
ctx_size = 32768
max_tokens = 16384

[chat."muse-glimmer-30b-q4_k_xl".reasoning]
mode = "always"
effort_levels = ["low", "medium", "high", "xhigh"]
effort_default = "high"
effort_key = "reasoning_strength"

[chat."muse-glimmer-30b-q4_k_xl".sampling]
temperature = 1.0
top_p = 0.95
top_k = 64


# --- Qwen3.8 27B ---
# Base: https://huggingface.co/Qwen/Qwen3.8-27B
#   └─ Quantization: https://huggingface.co/bartowski/Qwen3.8-27B-GGUF
# 5-bit: ~20.9 GB
# Hybrid architecture (qwen3_5). Never use it as the summary model.

# From model card:
# - Thinking is on by default and can be disabled per request:
#   chat_template_kwargs {"enable_thinking": false}
# - Effort uses reasoning_effort, an API parameter, not prompt text.
#   Levels: xhigh (default) / medium / low. There is no "high".
#   Whether llama-server passes it through is not yet verified.
# - preserve_thinking is on by default: the template keeps thinking
#   from all earlier turns in the conversation.

[chat."qwen3.8-27b-q5_k_m"]
file = "Qwen3.8-27B-Q5_K_M.gguf"
url = "https://huggingface.co/bartowski/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q5_K_M.gguf"
download = false
default = false
alias = "qwen3.8-27b-q5_k_m"
display_name = "Qwen3.8 27B Q5_K_M"
provider = "Alibaba"
family = "Qwen"
rank = 2
gpu_layers = -1
flash_attn = "on"
ctx_size = 32768
max_tokens = 16384

[chat."qwen3.8-27b-q5_k_m".reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"
effort_levels = ["low", "medium", "xhigh"]
effort_default = "xhigh"
effort_key = "reasoning_effort"   # not yet verified
effort_needs_reasoning = true

[chat."qwen3.8-27b-q5_k_m".sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[chat."qwen3.8-27b-q5_k_m".sampling.non_thinking]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5