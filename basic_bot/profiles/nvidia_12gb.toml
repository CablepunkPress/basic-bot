# Hardware Profile: NVIDIA 12GB+ VRAM
# Tested on: RTX 3060 12GB + 32GB DDR4
#
# Sequential server mode — one llama-server process at a time.
# All models fit in 12GB VRAM individually. No CPU offloading
# needed for the default chat model.
#
# Build: llama.cpp compiled with -DGGML_CUDA=ON


# --- Embedding ---
# Qwen3-Embedding-0.6B Q8_0, self-hosted with EOS token fix
# CPU-only, ~639MB

[embedding]
file = "Qwen3-Embedding-0.6B-Q8_0.gguf"
url = "https://huggingface.co/CablepunkPress/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf"
download = true
alias = "qwen3-embedding-0.6b-q8_0"
gpu_layers = -1
ctx_size = 32768
ubatch_size = 32768


# --- Summary ---
# Qwen3-8B Q8_0 — pure transformer, proven for summary folding
# Thinking always off. No presence penalty (single-shot generation,
# no prior assistant messages to parrot).

[summary]
file = "Qwen3-8B-Q8_0.gguf"
url = "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q8_0.gguf"
download = true
alias = "qwen3-8b-q8_0"
provider = "Alibaba"
family = "Qwen"
thinking_type = "qwen"
gpu_layers = -1
flash_attn = "on"
ctx_size = 16384
max_tokens = 4096
thinking = false

[summary.sampling]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 0.0


# --- Chat Models ---
# Multiple models can be defined. Only models with download = true
# are fetched at build time. Others are available if the user
# downloads them manually.
#
# The UI shows models whose GGUF file exists on disk.


# Qwen3-8B Q8_0 — same model as summary, higher precision than Q4_K_M
# Pure transformer, 8B dense, fits entirely in 12GB VRAM.
# Proven: ~15-30s per response without thinking, correct self-identification.
# Sampling per Qwen3-8B-GGUF card recommendations for quantized models.

[chat.qwen3-8b-q8_0]
file = "Qwen3-8B-Q8_0.gguf"
url = "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q8_0.gguf"
download = true
default = true
alias = "qwen3-8b-q8_0"
display_name = "Qwen3 8B Q8_0"
provider = "Alibaba"
family = "Qwen"
rank = 1
thinking_type = "qwen"
gpu_layers = -1
flash_attn = "on"
ctx_size = 32768
max_tokens = 16384

[chat.qwen3-8b-q8_0.sampling.thinking]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5

[chat.qwen3-8b-q8_0.sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5


# Qwen3.5-9B Q5_K_M — hybrid SSM/attention (DeltaNet + Gated Attention)
# 9B parameters, all active per token. ~6.1 GiB on disk.
# Unsloth quantization. Do NOT use for summary (destroys existing summaries).
# Sampling per Qwen3.5-9B card recommendations for general tasks.

[chat."qwen3.5-9b-q5_k_m"]
file = "Qwen3.5-9B-Q5_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q5_K_M.gguf"
download = false
default = false
alias = "qwen3.5-9b-q5_k_m"
display_name = "Qwen3.5 9B Q5_K_M"
provider = "Alibaba"
family = "Qwen"
rank = 2
thinking_type = "qwen"
gpu_layers = -1
flash_attn = "on"
ctx_size = 32768
max_tokens = 16384

[chat."qwen3.5-9b-q5_k_m".sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5

[chat."qwen3.5-9b-q5_k_m".sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
