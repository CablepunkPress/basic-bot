# Hardware Profile: Vulkan 12GB
# Tested on: RTX 3060 12GB + 32GB DDR4
#
# Sequential server mode: one llama-server process at a time. Each
# model fits in 12GB of graphics memory on its own, with no CPU
# offloading for the default chat model.
#
# Format and needs
# format is the version of this file's layout, so the engine can tell
# when a profile was written for a different version of it.
# [needs] states what the machine must have:
#   backend     the GPU backend llama.cpp is built with: "metal" or "vulkan"
#   memory_gb   the memory the models can use: unified memory on a Mac,
#               the graphics card's own memory with Vulkan
#
# Reasoning tables
# A [reasoning] table describes how a model reasons, in the engine's
# terms, and how those terms translate for this model's chat template.
# No table: the model does not reason.
#   mode                    "optional" (can be switched off) or "always"
#   default                 optional only: on or off when nothing is chosen
#   switch_key              optional only: chat_template_kwargs key for on/off
#   effort_levels           levels the model accepts, lowest to highest
#   effort_default          level used when nothing is chosen
#   effort_key              chat_template_kwargs key for the level
#   effort_needs_reasoning  optional only: true if effort does nothing
#                           while reasoning is off
#
# Pinned downloads
# Each url names a specific commit, not main, so a publisher's later
# re-upload can't change what gets downloaded. sha256 and size come
# from Hugging Face's API for that commit and are checked after
# download. To move to a newer file, update all three together.
# The embedding, summary, and default chat models are always
# downloaded; the build offers the other chat models, once each.

format = 1

[needs]
backend = "vulkan"
memory_gb = 12

# --- Embedding ---
# Nemotron-3-Embed-8B Q8_0: 8B dense transformer, 4096-dim vectors,
# query:/passage: prefix format. ~8.46 GB. The same file as metal_32gb.

[embedding]
file = "Nemotron-3-Embed-8B-Q8_0.gguf"
url = "https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF/resolve/1ffb81e403311c4dc6879b9c3cbb6ebfa18b86df/Nemotron-3-Embed-8B-Q8_0.gguf"
sha256 = "0d0e0d9f291fc116a830bf5cd0f0e18d756c6b6f0f24f9d2ba64f4d188bc78fd"
size = 8458435477
alias = "nemotron-3-embed-8b-q8_0"
query_prefix = "query: "
passage_prefix = "passage: "
gpu_layers = -1
ctx_size = 8192
batch_size = 8192
ubatch_size = 8192


# --- Summary ---
# Gemma 4 12B IT Q5_K_M: pure transformer, 12B dense, ~8.77 GB. From the
# same commit as metal_32gb's Q6_K_L. A pure transformer avoids the
# hybrid SSM/attention failure that destroyed summaries.
# Thinking always off. No presence penalty (single-shot generation).

[summary]
file = "gemma-4-12B-it-Q5_K_M.gguf"
url = "https://huggingface.co/bartowski/gemma-4-12B-it-GGUF/resolve/2ae7d41be21ca62de00a2d320ee9cec50daa3aa6/gemma-4-12B-it-Q5_K_M.gguf"
sha256 = "24fe88d9e6bba6a1805629a09e40d4d837a894d559c7708055f7a03211e2a25e"
size = 8774965728
alias = "gemma-4-12b-it-q5_k_m"
publisher = "Google"
family = "Gemma"
gpu_layers = -1
flash_attn = "on"
ctx_size = 16384
max_tokens = 8192

[summary.reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"

[summary.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
presence_penalty = 0.0


# --- Chat Models ---
# The UI shows models whose GGUF file exists on disk.

# --- Gemma 4 26B A4B ---
# Base: https://huggingface.co/google/gemma-4-26B-A4B
#   └─ Fine-Tuning: https://huggingface.co/google/gemma-4-26B-A4B-it
#       └─ Quantization: https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf
# Mixture of experts: 25.2B parameters, 3.8B active per token (8 of
# 128 experts plus one shared), 30 layers. ~14.4 GB.
# Google's quantization-aware training (QAT) Q4_0: trained to be cut
# to 4 bits, so it keeps more quality than an ordinary 4-bit file.
# From the Gemma 4 model cards:
# - Thinking is off unless switched on per request with
#   chat_template_kwargs {"enable_thinking": true}. No effort levels.
# - Google recommends temperature 1.0, top_p 0.95, top_k 64 for all
#   uses, with or without thinking.
# - Earlier turns should carry only final answers, not thinking; the
#   chat template embedded in the GGUF handles this.
# - Vision needs the separate mmproj file, which isn't downloaded yet.
# - No drafter: Google's card says one must be a QAT checkpoint of the
#   same precision, and none is published as a GGUF.
# - It doesn't fit in 12 GB. llama.cpp's automatic fitting moves
#   experts to system memory until the rest fits, as long as
#   gpu_layers stays at -1 and n_cpu_moe is not set: setting tensor
#   placement by hand turns the fitting off.

[chat."gemma-4-26b-a4b-it-qat-q4_0"]
file = "gemma-4-26B_q4_0-it.gguf"
url = "https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf/resolve/d1c082be9cf3c8a514acf63b8761f4b41935842e/gemma-4-26B_q4_0-it.gguf"
sha256 = "3eca3b8f6d7baf218a7dd6bba5fb59a56ee25fe2d567b6f5f589b4f697eca51d"
size = 14439363584
default = true
alias = "gemma-4-26b-a4b-it-qat-q4_0"
display_name = "Gemma 4 26B A4B QAT Q4_0"
publisher = "Google"
family = "Gemma"
rank = 1
gpu_layers = -1
flash_attn = "on"
ctx_size = 32768
max_tokens = 16384

[chat."gemma-4-26b-a4b-it-qat-q4_0".reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"

[chat."gemma-4-26b-a4b-it-qat-q4_0".sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
