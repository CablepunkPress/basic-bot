# Hardware Profile: Vulkan 12GB
# Tested on: RTX 3060 12GB + 32GB DDR4
#
# Sequential server mode: one llama-server process at a time. The
# embedding and summary models each fit in 12GB of graphics memory on
# their own. The chat model doesn't, and llama.cpp's automatic fitting
# moves part of it to system memory (see the chat model's entry).
#
# Format and needs
# format is the version of this file's layout, so the engine can tell
# when a profile was written for a different version of it.
# [needs] states what the machine must have:
#   backend     the GPU backend llama.cpp is built with: "metal" or "vulkan"
#   memory_gb   the memory the models can use: unified memory on a Mac,
#               the graphics card's own memory with Vulkan
#
# Reasoning tables
# A [reasoning] table describes how a model reasons, in the engine's
# terms, and how those terms translate for this model's chat template.
# No table: the model does not reason.
#   mode                    "optional" (can be switched off) or "always"
#   default                 optional only: on or off when nothing is chosen
#   switch_key              optional only: chat_template_kwargs key for on/off
#   effort_levels           levels the model accepts, lowest to highest
#   effort_default          level used when nothing is chosen
#   effort_key              chat_template_kwargs key for the level
#   effort_needs_reasoning  optional only: true if effort does nothing
#                           while reasoning is off
#   budget                  the most tokens the model may spend reasoning
#                           on one request: one number, or a table by
#                           effort level (a level left out has no limit).
#                           When it runs out, llama-server tells the model
#                           to answer. A guard against reasoning that never
#                           ends; max_tokens still caps the whole reply.
#                           Starting values, tuned from the log's "Reasoning
#                           budget reached" lines.
#   budget_start_tag        where reasoning starts and ends, for a template
#   budget_end_tag          llama.cpp can't read them from. Without them
#                           there, the budget is ignored without a word.
#                           Test each model's budget once (models.md).
#   prefill                 the opening words of the model's reasoning,
#                           written for it at the start of each turn, so a
#                           model that would skip reasoning on turns it
#                           judges easy reasons anyway. End it in an open
#                           question. An agent's config.toml can turn it
#                           off with force_reasoning = false.
#
# Pinned downloads
# Each url names a specific commit, not main, so a publisher's later
# re-upload can't change what gets downloaded. sha256 and size come
# from Hugging Face's API for that commit and are checked after
# download. To move to a newer file, update all three together.
# The build downloads the embedding, summary, and default chat
# models; 'bountiful models' offers the other chat models if there are any.
# display_name is the name people see. Chat models need one; for
# the embedding and summary models it's optional, and the file
# name stands in without it.
#
# cache_ram_mib
# llama-server keeps copies of earlier prompts' states in ordinary
# memory, up to 8192 MiB unless told otherwise, in case a request
# returns to one. One conversation rarely does, and here system memory
# also holds the chat model's offloaded experts. 0 turns them off.
#
# cache_type_k, cache_type_v
# The KV cache holds every token of the current prompt, so its size
# follows the longest prompt of a session. q8_0 stores it at 8 bits
# instead of 16, roughly halving it, which leaves more graphics memory
# for the model's own weights; a quantized V cache needs flash
# attention.
#
# ctx_checkpoints
# For a model whose cache can't be cut back to an earlier point
# (sliding-window attention, as in the Gemmas), llama-server saves
# copies of the cache, context checkpoints, so it can return to an
# earlier point in a conversation: up to 32 by default, made silently
# two or three per request. With none, a turn that goes back rereads
# the whole conversation (most turns, since earlier turns' reasoning
# and tool steps aren't sent again). The number is set per model, in
# its own entry: it depends on the model's design, not the agent.

format = 1

[needs]
backend = "vulkan"
memory_gb = 12

# --- Embedding ---
# Nemotron-3-Embed-8B Q8_0: 8B dense transformer, 4096-dim vectors,
# query:/passage: prefix format. ~8.46 GB. The same file as metal_32gb.

[embedding]
file = "Nemotron-3-Embed-8B-Q8_0.gguf"
url = "https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF/resolve/1ffb81e403311c4dc6879b9c3cbb6ebfa18b86df/Nemotron-3-Embed-8B-Q8_0.gguf"
sha256 = "0d0e0d9f291fc116a830bf5cd0f0e18d756c6b6f0f24f9d2ba64f4d188bc78fd"
size = 8458435477
display_name = "Nemotron 3 Embed 8B Q8_0"
alias = "nemotron-3-embed-8b-q8_0"
query_prefix = "query: "
passage_prefix = "passage: "
gpu_layers = -1
ctx_size = 8192
batch_size = 8192
ubatch_size = 8192


# --- Summary ---
# Gemma 4 12B IT Q5_K_M: pure transformer, 12B dense, ~8.77 GB. From the
# same commit as metal_32gb's Q6_K_L. A pure transformer avoids the
# hybrid SSM/attention failure that destroyed summaries.
# Thinking always off. No presence penalty (single-shot generation).

[summary]
file = "gemma-4-12B-it-Q5_K_M.gguf"
url = "https://huggingface.co/bartowski/gemma-4-12B-it-GGUF/resolve/2ae7d41be21ca62de00a2d320ee9cec50daa3aa6/gemma-4-12B-it-Q5_K_M.gguf"
sha256 = "24fe88d9e6bba6a1805629a09e40d4d837a894d559c7708055f7a03211e2a25e"
size = 8774965728
display_name = "Gemma 4 12B Q5_K_M"
alias = "gemma-4-12b-it-q5_k_m"
publisher = "Google"
family = "Gemma"
gpu_layers = -1
flash_attn = "on"
ctx_size = 16384
max_tokens = 2048
message_tokens = 2048
ctx_checkpoints = 0

[summary.reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"

[summary.sampling]
temperature = 0.6
top_p = 0.95
top_k = 64
presence_penalty = 0.0


# --- Chat Models ---

#------------
#   MoE
#------------

# The UI shows models whose GGUF file exists on disk.

# --- Gemma 4 26B A4B ---
# Base: https://huggingface.co/google/gemma-4-26B-A4B
#   └─ Fine-Tuning: https://huggingface.co/google/gemma-4-26B-A4B-it
#       └─ QAT: https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-unquantized
#           └─ Quantization: https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF
# Mixture of experts: 25.2B parameters, 3.8B active per token (8 of
# 128 experts plus one shared), 30 layers, mostly sliding-window
# attention. ~14.2 GB.
# Google's quantization-aware training (QAT): trained to be cut to
# 4 bits, so it keeps more quality than an ordinary 4-bit file.
# Unsloth's Dynamic 4-bit (UD-Q4_K_XL) of Google's unquantized QAT
# checkpoint: the same file as metal_32gb, so both profiles run the
# same chat model.
# From the Gemma 4 model cards:
# - Thinking is off unless switched on per request with
#   chat_template_kwargs {"enable_thinking": true}. No effort levels.
# - Google recommends temperature 1.0, top_p 0.95, top_k 64 for all
#   uses, with or without thinking.
# - Earlier turns should carry only final answers, not thinking; the
#   chat template embedded in the GGUF handles this.
# - Vision needs the separate mmproj file, which isn't downloaded yet.
# No drafter here: metal_32gb's MTP drafter for this model hasn't been
# tried on Vulkan, and on this card its memory would push more experts
# out to system memory.
# It doesn't fit in 12 GB. llama.cpp's automatic fitting (--fit, on by
# default in the pinned v0.7.0, common/fit.cpp) measures the card's
# free memory, keeps a 1 GiB margin, and moves whole layers' expert
# tensors to system memory until the rest, with the context and KV
# cache set here, fits. It gives up if gpu_layers is anything but -1
# or if tensor placement is set by hand, so leave gpu_layers at -1 and
# don't set n_cpu_moe. The context set here is kept; the fitting only
# changes what isn't set. What it moved shows in llama-chat.log.
# Generation is limited by the experts read from system memory, so a
# smaller ctx_size, which leaves more experts on the card, is the
# lever if it's too slow.

[chat."gemma-4-26b-a4b-it-qat-ud-q4_k_xl"]
file = "gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
url = "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF/resolve/7b92b5b28818151e8669af2e45e88d6086f490dd/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
sha256 = "a7c5bc715f5ff8e99a3e8901ce7d2b42b402c669bf24f7c5250747633d0f5891"
size = 14249047104
default = true
alias = "gemma-4-26b-a4b-it-qat-ud-q4_k_xl"
display_name = "Gemma 4 26B A4B QAT UD-Q4_K_XL"
publisher = "Google"
family = "Gemma"
rank = 1
gpu_layers = -1   # leaves llama.cpp's automatic fitting on (above)
flash_attn = "on"
ctx_size = 65536
max_tokens = 4096
cache_ram_mib = 0
cache_type_k = "q8_0"
cache_type_v = "q8_0"
ctx_checkpoints = 4

[chat."gemma-4-26b-a4b-it-qat-ud-q4_k_xl".reasoning]
mode = "optional"
default = true
switch_key = "enable_thinking"
budget = 1024
# Force model to open reasoning channel
prefill = "Let me read the user's latest message. What is it asking? I'll plan my steps, and if I need a tool, calling it comes first, since I can only answer from a result once I have it. So: is there a name, date, number, or detail I should check with a tool rather than give from memory, or is the user telling me something they already looked up?"

[chat."gemma-4-26b-a4b-it-qat-ud-q4_k_xl".sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
