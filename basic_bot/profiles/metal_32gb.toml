# --- Muse Glimmer 30B ---
# Base: https://huggingface.co/meta-models/Muse-Glimmer-30B
#   └─ Quantization: https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
# 4-bit: ~19.7 GB

# From the GGUF model card:
# - llama-server must run with --jinja. The chat template is embedded in
#   the GGUF and handles reasoning strength and output parsing.
# - Reasoning cannot be switched off. --reasoning off and
#   reasoning_effort "none" have no effect.
# - Strength is set per request with
#   chat_template_kwargs {"reasoning_strength": "<level>"}.
#   Levels: low / medium / high / xhigh. Default: high.
#   The template also accepts a "Reasoning strength: <level>" or
#   "Reasoning effort: <level>" line in the system prompt.
# - Thinking arrives separately in reasoning_content.
# - llama-server divides -c across -np slots. A generation that runs out
#   of context returns no answer and no error.
# - Stop tokens are <|end_of_text|> and <|eot|>. Never stop on <|eom|>.
# - DFlash drafter (separate file, ~1.6 GB) enables speculative
#   decoding: faster generation, same output. A startup warning,
#   "[spec] failed to measure draft model memory", is harmless.
# - The template writes "Reasoning strength: X." at the end of the
#   system message, defaulting to high. Changing effort therefore
#   invalidates the prompt cache: the whole conversation is re-read.
#   Choose a default you rarely need to change.
# Optional since October 25, when the Gemma 4 31B became the default:
# in the head-to-head it answered broad questions from memory and
# got details wrong, and argued with itself where Gemma planned.

[chat."muse-glimmer-30b-q4_k_xl"]
file = "Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
url = "https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/70bf1b61ac09f91b24d39038091b41c582bc5d7a/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
sha256 = "ac7023d6a4c704eb9af54ab53e476a66b7f5b6c0ef2fc4a8dde5253c291a6c38"
size = 19653960832
default = false
alias = "muse-glimmer-30b-q4_k_xl"
display_name = "Muse Glimmer 30B Q4_K_XL"
publisher = "Meta"
family = "Muse"
rank = 2
gpu_layers = -1
flash_attn = "on"
ctx_size = 131072
max_tokens = 16384
cache_ram_mib = 0
cache_type_k = "q8_0"
cache_type_v = "q8_0"
ctx_checkpoints = 32

[chat."muse-glimmer-30b-q4_k_xl".reasoning]
mode = "always"
effort_levels = ["low", "medium", "high", "xhigh"]
effort_default = "high"
effort_key = "reasoning_strength"
# On October 24, at high, Muse reasoned for two minutes without
# answering until it was stopped. About 70 seconds at high.
budget = { low = 512, medium = 768, high = 1024, xhigh = 2048 }
# llama.cpp's Muse parser doesn't give the budget these, so they're
# named here: reasoning is a " to=self" message ending in <|eom|>.
# The leading space is part of the tag. Tested October 24.
budget_start_tag = " to=self<|message|>"
budget_end_tag = "<|eom|>"
# Muse skips reasoning on turns it judges easy, and on those turns it
# never considers its tools: on October 25 every answer it gave
# without reasoning came from memory, and most were wrong. This opens
# its reasoning for it on every turn (see the header).
prefill = "Before I answer: is there a specific name, date, number, or detail here that I should check with a tool rather than give from memory? Let me work it out:"

