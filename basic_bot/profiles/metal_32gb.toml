# Hardware Profile: Metal 32GB
# Designed for: Apple M6 Mac Mini 32GB unified memory
#
# Format and needs
# format is the version of this file's layout, so the engine can tell
# when a profile was written for a different version of it.
# [needs] states what the machine must have:
#   backend     the GPU backend llama.cpp is built with: "metal" or "vulkan"
#   memory_gb   the memory the models can use: unified memory on a Mac,
#               the graphics card's own memory with Vulkan
#
# Reasoning tables
# A [reasoning] table describes how a model reasons, in the engine's
# terms, and how those terms translate for this model's chat template.
# No table: the model does not reason.
#   mode                    "optional" (can be switched off) or "always"
#   default                 optional only: on or off when nothing is chosen
#   switch_key              optional only: chat_template_kwargs key for on/off
#   effort_levels           levels the model accepts, lowest to highest
#   effort_default          level used when nothing is chosen
#   effort_key              chat_template_kwargs key for the level
#   effort_needs_reasoning  optional only: true if effort does nothing
#                           while reasoning is off
#
# Pinned downloads
# Each url names a specific commit, not main, so a publisher's later
# re-upload can't change what gets downloaded. sha256 and size come
# from Hugging Face's API for that commit and are checked after
# download. To move to a newer file, update all three together.
# The build downloads the embedding, summary, and default chat
# models; 'bountiful models' offers the other chat models.
# display_name is the name people see. Chat models need one; for
# the embedding and summary models it's optional, and the file
# name stands in without it.
#
# Draft tables (speculative decoding)
# A [draft] table speeds up a chat model: a small, fast drafter
# proposes tokens, and the model checks them all in one pass. The
# output is the model's own; only the speed changes. Either:
#   type = "mtp"   drafting layers built into the model file
# or a separate drafter file, pinned like any model:
#   file, url, sha256, size
#   gpu_layers     drafter layers to run on the GPU
# or both, for a drafter file whose type llama.cpp can't read from
# it, such as Gemma 4's MTP assistants.

format = 1

[needs]
backend = "metal"
memory_gb = 32

# --- Embedding ---
# Base: https://huggingface.co/mistralai/Ministral-3-8B-Base-2512
#   └─ Post-Training: https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512
#      └─ Fine-Tuning: https://huggingface.co/nvidia/Nemotron-3-Embed-8B-BF16
#          └─ Quantization: https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF
# 8-bit = ~8.46 GB
[embedding]
file = "Nemotron-3-Embed-8B-Q8_0.gguf"
url = "https://huggingface.co/Abiray/Nemotron-3-Embed-8B-GGUF/resolve/1ffb81e403311c4dc6879b9c3cbb6ebfa18b86df/Nemotron-3-Embed-8B-Q8_0.gguf"
sha256 = "0d0e0d9f291fc116a830bf5cd0f0e18d756c6b6f0f24f9d2ba64f4d188bc78fd"
size = 8458435477
display_name = "Nemotron 3 Embed 8B Q8_0"
alias = "nemotron-3-embed-8b-q8_0"
query_prefix = "query: "
passage_prefix = "passage: "
gpu_layers = -1
ctx_size = 16384
batch_size = 16384
ubatch_size = 16384


# --- Summary ---
# Base: https://huggingface.co/google/gemma-4-12B
#   └─ Fine-Tuning: https://huggingface.co/google/gemma-4-12B-it
#       └─ Quantization: https://huggingface.co/bartowski/gemma-4-12B-it-GGUF
# 6-bit, with 8-bit embed and output weights = ~10.48 GB
[summary]
file = "gemma-4-12B-it-Q6_K_L.gguf"
url = "https://huggingface.co/bartowski/gemma-4-12B-it-GGUF/resolve/2ae7d41be21ca62de00a2d320ee9cec50daa3aa6/gemma-4-12B-it-Q6_K_L.gguf"
sha256 = "52766ef472857441086f70f6d1013bec7b9b5238f469c3efefde2281e1c34209"
size = 10483120608
display_name = "Gemma 4 12B Q6_K_L"
alias = "gemma-4-12b-it-q6_k_l"
publisher = "Google"
family = "Gemma"
gpu_layers = -1
flash_attn = "on"
ctx_size = 16384
max_tokens = 8192

[summary.reasoning]
mode = "optional"
default = false
switch_key = "enable_thinking"

[summary.sampling]
# 0.6 rather than Google's 1.0: in testing on the same batch, six runs
# at 0.6 had no speaker, invention, or number errors, against several
# at 1.0 and 0.4. A summary should be faithful rather than varied.
temperature = 0.6
top_p = 0.95
top_k = 64
presence_penalty = 0.0


# --- Chat Models ---

# --- Muse Glimmer 30B ---
# Base: https://huggingface.co/meta-models/Muse-Glimmer-30B
#   └─ Quantization: https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
# 4-bit: ~19.7 GB

# From the GGUF model card:
# - llama-server must run with --jinja. The chat template is embedded in
#   the GGUF and handles reasoning strength and output parsing.
# - Reasoning cannot be switched off. --reasoning off and
#   reasoning_effort "none" have no effect.
# - Strength is set per request with
#   chat_template_kwargs {"reasoning_strength": "<level>"}.
#   Levels: low / medium / high / xhigh. Default: high.
#   The template also accepts a "Reasoning strength: <level>" or
#   "Reasoning effort: <level>" line in the system prompt.
# - Thinking arrives separately in reasoning_content.
# - llama-server divides -c across -np slots. A generation that runs out
#   of context returns no answer and no error.
# - Stop tokens are <|end_of_text|> and <|eot|>. Never stop on <|eom|>.
# - DFlash drafter (separate file, ~1.6 GB) enables speculative
#   decoding: faster generation, same output. A startup warning,
#   "[spec] failed to measure draft model memory", is harmless.
# - The template writes "Reasoning strength: X." at the end of the
#   system message, defaulting to high. Changing effort therefore
#   invalidates the prompt cache: the whole conversation is re-read.
#   Choose a default you rarely need to change.

[chat."muse-glimmer-30b-q4_k_xl"]
file = "Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
url = "https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/70bf1b61ac09f91b24d39038091b41c582bc5d7a/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf"
sha256 = "ac7023d6a4c704eb9af54ab53e476a66b7f5b6c0ef2fc4a8dde5253c291a6c38"
size = 19653960832
default = true
alias = "muse-glimmer-30b-q4_k_xl"
display_name = "Muse Glimmer 30B Q4_K_XL"
publisher = "Meta"
family = "Muse"
rank = 1
gpu_layers = -1
flash_attn = "on"
ctx_size = 131072
max_tokens = 16384

[chat."muse-glimmer-30b-q4_k_xl".reasoning]
mode = "always"
effort_levels = ["low", "medium", "high", "xhigh"]
effort_default = "high"
effort_key = "reasoning_strength"

[chat."muse-glimmer-30b-q4_k_xl".draft]
file = "dflash-Muse-Glimmer-30B-Q4_K_M.gguf"
url = "https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/70bf1b61ac09f91b24d39038091b41c582bc5d7a/dflash-Muse-Glimmer-30B-Q4_K_M.gguf"
sha256 = "b2e808bf656086fe86bd0d0bd990f01d33e377537a07c02d45371517c8b264ef"
size = 1631208128
gpu_layers = 99   # as in Meta's example

[chat."muse-glimmer-30b-q4_k_xl".sampling]
temperature = 1.0
top_p = 0.95
top_k = 64


# --- Gemma 4 31B ---
# Base: https://huggingface.co/google/gemma-4-31B
#   └─ Fine-Tuning: https://huggingface.co/google/gemma-4-31B-it
#       └─ Quantization: https://huggingface.co/bartowski/google_gemma-4-31B-it-GGUF
# Dense, 30.7B parameters, 60 layers, mostly sliding-window attention.
# 4-bit: ~19.6 GB, plus the MTP drafter, ~0.5 GB.
# From the Gemma 4 model cards:
# - Thinking is off unless switched on per request with
#   chat_template_kwargs {"enable_thinking": true}. No effort levels.
# - Google recommends temperature 1.0, top_p 0.95, top_k 64 for all
#   uses, with or without thinking.
# - Earlier turns should carry only final answers, not thinking; the
#   chat template embedded in the GGUF handles this.
# - Vision needs the separate mmproj file, which isn't downloaded yet.
# - The MTP drafter is Google's gemma-4-31B-it-assistant. llama.cpp
#   can't tell its type from the file, so the draft table states it.
#   Google claims up to 3x faster generation; on the M6's bandwidth
#   this dense model is slow without it.

[chat."gemma-4-31b-it-q4_k_m"]
