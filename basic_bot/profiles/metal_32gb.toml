alias = "gemma-4-31b-it-q4_k_m"
display_name = "Gemma 4 31B Q4_K_M"
publisher = "Google"
family = "Gemma"
rank = 1
gpu_layers = -1
flash_attn = "on"
# 256K is the most the model takes (Google's card). Only its global
# layers grow with this; the sliding-window ones hold 1,024 tokens
# whatever it is. Doubled from 32768 on October 26, after one
# recall_message result filled half of it.
ctx_size = 65536
max_tokens = 16384
cache_ram_mib = 0
cache_type_k = "q8_0"
cache_type_v = "q8_0"
ctx_checkpoints = 4

[chat."gemma-4-31b-it-q4_k_m".reasoning]
