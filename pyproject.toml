[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-bot"
version = "0.4.0"
description = "A general-purpose AI assistant engine"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
]

[project.optional-dependencies]
local = [
    "flask",
    "keyring",
]
cloud = [
    "fastapi",
    "uvicorn[standard]",
    "google-cloud-firestore",
    "google-genai",
]

[tool.setuptools.packages.find]
include = ["basic_bot*"]

[tool.setuptools.package-data]
basic_bot = ["instructions/*.md"]
