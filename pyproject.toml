[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-bot"
dynamic = ["version"]
description = "A local-first AI assistant engine"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
local = [
    "keyring",
    "psutil",
]
api = [
    "anthropic",
]
dev = [
    "basic-bot[local,api]",
]

[tool.setuptools.dynamic]
version = {attr = "basic_bot.__version__"}

[tool.setuptools.packages.find]
include = ["basic_bot*"]

[tool.setuptools.package-data]
basic_bot = ["instructions/*.md", "profiles/*.toml"]
