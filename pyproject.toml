[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-bot"
dynamic = ["version"]
description = "A general-purpose AI assistant engine"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
]

[project.optional-dependencies]
local = [
    "keyring",
    "psutil",
]
cloud = [
    "fastapi",
    "uvicorn[standard]",
    "google-cloud-firestore",
    "google-genai",
]
dev = [
    "basic-bot[local,cloud]",
]

[tool.setuptools.dynamic]
version = {attr = "basic_bot.__version__"}

[tool.setuptools.packages.find]
include = ["basic_bot*"]

[tool.setuptools.package-data]
basic_bot = ["instructions/*.md"]
