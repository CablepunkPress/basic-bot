<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Bot</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.4/marked.min.js" integrity="sha512-oUb+v+OGnC4ls/U+74UExKiWPxg/0M1AW6WGR94XFExsapAwqFRWwG1uds2YO/k38mAaai62SKhsMQHbIYX5Rw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div id="app">
    <div class="chat-view">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <aside class="chat-sidebar" id="chatSidebar">
        <div class="sidebar-header">
          <button class="btn-sidebar-close" id="sidebarClose">&times;</button>
        </div>
        <h2 class="sidebar-agent-name">Basic Bot</h2>

        <div class="sidebar-section">
          <label for="modelSelect" class="sidebar-label">Model</label>
          <select id="modelSelect" class="sidebar-select"></select>
        </div>

        <div class="sidebar-section" id="effortSection" style="display: none;">
          <label for="effortSelect" class="sidebar-label">Effort</label>
          <select id="effortSelect" class="sidebar-select"></select>
        </div>

        <div class="sidebar-section" id="thinkingSection">
          <label class="sidebar-toggle-label">
            <input type="checkbox" id="thinkingToggle"> Deep Reasoning
          </label>
        </div>

        <div class="sidebar-section sidebar-history-note" id="historyNote"></div>
      </aside>

      <div class="chat-main">
        <div class="chat-main-header">
          <button class="btn-sidebar-toggle" id="sidebarToggle">&#9776;</button>
          <span class="chat-main-agent-name">Basic Bot</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
          <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
          <div class="chat-input-actions">
            <button class="btn-send" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
